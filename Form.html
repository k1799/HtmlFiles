<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Form</title>
</head>

<body>
    <form action="">
        <h3>Admission Form</h3>
        <label for=""><strong>Student Name:</strong></label>
        <input type="text" name="" id="" placeholder="Enter Your Full Name">
        <label for=""><strong>Date of Birth:</strong></label>
        <input type="date" name="" id=""><br><br>
        <label for=""><strong>Gender</strong></label>

        <input type="radio" name="Gender" id="male">
        <label for="male">Male</label>

        <input type="radio" name="Gender" id="female">
        <label for="female">Female</label>

        <input type="radio" name="Gender" id="other">
        <label for="other">Other</label><br><br>

        <label for=""><strong>Class Applying For:</strong></label>

        <select name="" id="">
        <option value="">10th</option>
        <option value="">12th</option>
        </select><br><br>

        <label for=""><strong>Parent Name:</strong></label>
        <input type="text" name="" id=""placeholder="Enter Parent Name"><br><br>

        <label for=""><strong>Email:</strong></label>
        <input type="email" name="" id=""placeholder="Enter Email"><br><br>

        <label for=""><strong>Enter Mobile Number:</strong></label>
        <input type="number" name="" id=""placeholder="Enter Mobil Number"><br><br>
        
                <label for=""><strong>Address:</strong></label>
                <textarea name="" id=""></textarea><br><br>

                        <label for=""><strong>Upload Files:</strong></label>
                <input type="file" name="" id=""><br><br>

                <button type="submit">Sumbit</button>
                <button type="reset">Reset</button>

        
    </form>
</body>

</html>
