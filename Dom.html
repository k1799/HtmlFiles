<!DOCTYPE html>
<html lang="en">

<head>

<body>

    <h1 class="red">uiguig</h1>

      <h2>DOM Selectors UI ✨</h2>

      <!-- ID -->
       <div class="row">
        <label id="nameid">ID:</label>

      </div> 

      <!-- CLASS -->
       <div class="row">
         <label>Class:</label>
        <input class="myClass" value="Class 1">
      </div>

      <div class="row">
        <label></label>
        <input class="myClass" value="Class 2">

      <!-- TAG -->
     <div class="row">

      <p>Paragraph 1</p>

        <label>QuerySelectorAll:</label>

      </div> 

     
    </form>

        let b =document.getElementById("name");
        console.log(b.textContent);

        for (let i of a) {
