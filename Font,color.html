<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font & color</title>
    <style>
        /* font ,color , box model concept using */
      p{
        font-family: Arial, Helvetica, sans-serif;
        font-size: large;
        font-weight: 800;
        font-style: italic;
        border: 3px solid blue;
        /* thickness,solid,color */
        width: 300px;
        height: 300px;
        /* text-decoration: underline; */
        text-decoration-color: chartreuse;
        text-decoration-thickness: 5px;
        margin: 20px;
        padding-top: 20px;
        padding-left: 10px;
        text-shadow: 2px 2px 5px yellow;
      }
      div{
         margin-left: 500px;
      }
    </style>
</head>
<body>
    <p>
        Lorem ipsum dolor sit amet consectetur, adipisicing elit. Reiciendis, quos.
    </p>
    <p>
        Lorem ipsum dolor sit amet.
    </p>
    <div>
        <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Cumque repellendus nam facilis cum natus.
        </p>
    </div>
</body>
</html>
