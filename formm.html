<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <h2>Admission Form</h2>
        <label for=""><strong>Student Name: </strong></label>
        <input type="text" placeholder="Enter your Name ">
        <label for=""><strong>DOB :</strong></label>
        <input type="date"><br><br>
        <label for=""><strong>Gender :</strong></label>
        <input type="radio" name="gender" id="">
        <label for=""><strong>Male</strong></label>
        <input type="radio" name="gender" id="">
        <label for=""><strong>Female</strong></label>
        <input type="radio" name="gender" id="">
        <label for=""><strong>Other </strong></label>
        <br><br>
        <label for=""><strong>Class Applying for: </strong></label>
        <select name="" id="">
        <option value="">Select Class</option>
        <option value="">10th Class</option>
        <option value="">12th Class</option>
        </select>
        <br><br>
        <label for=""><strong>Parent Name: </strong></label>
        <input type="text" placeholder="Enter parent Name ">
        <br><br>
        <label for=""><strong>Enter email id :</strong></label>
        <input type="email" placeholder="Enter email id ">
        <br><br>
        <label for=""><strong>Enter phone number :</strong></label>
        <input type="tel" placeholder="Enter phone number ">
        <br><br>
        <label for=""><strong>Enter address :</strong></label>
        <textarea name="" id="" placeholder="Enter address"></textarea>
        <br><br>
        <label for=""><strong>Upload Photo :</strong></label>
        <input type="file" name="" id="">
        <br><br>
        <input type="button" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
