<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hover</title>
    <style>
        h1{
            width: fit-content  ;
        }
        a:hover{
        cursor:pointer;
        text-decoration: none;
        font-weight: 900;
        }
        button:hover
        {
            background-color: aquamarine;
            cursor: pointer;
            padding: 10px;
        }
        h1:hover
        {
            color: yellow;
            cursor: grabbing;
            background-color: tomato;
        }
    </style>
</head>

<body>
    <a href="">welcome</a><br><br><br>
    <button>submit</button>
    <h1>thankyou</h1>
</body>
</html>
