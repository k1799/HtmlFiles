<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inheritance</title>
    <style>
        div{
            color: blue;
            border: 3px solid green;
            margin-left: 20px;
            /* text-align: center; */
            padding-left: 100px;
        }
        h1{
            border: 2px solid yellow;
            margin-left: 30px;

        }
        p{
            border: inherit;
            color: rgb(255, 127, 234);
        }
    </style>
</head>
<body>
    <div>
        <h1>welcome</h1>
        <p>hi</p>
    <section>
        <p>
            Lorem ipsum dolor sit amet.
        </p>
    </section>
    </div>
</body>
</html>
