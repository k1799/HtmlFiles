<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Data Table</title>
    <style>
        table {
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>

<body>
    <!-- QUESTION 1:
     Design a simple web page using HTML and JavaScript. 
     Requirements: 
     1. Create a form.
     2. Add a Submit button.
     3.When the Submit button is clicked: 
     I. Retrieve all the entered form data using JavaScript.
     II. Display the entered data dynamically in a table format below the form.
     III. Each time the button is clicked, a new row should be added to the table.  -->
    <h2>Registeration Form</h2>
    <form action="" id="myform">
        <label for="">Name:</label>
        <input type="text" id="name" required><br><br>

        <label for="">Email:</label>
        <input type="email" id="email" required><br><br>

        <label for="">Age:</label>
        <input type="number" id="age" required><br><br>

        <button type="submit">Sumbit</button>
    </form>

    <table id="datatable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Age</th>
            </tr>
        </thead>

        <tbody id="tablebody"></tbody>
    </table>

    <script>
        let form = document.getElementById("myform");
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let age = document.getElementById("age").value;

            let row = document.createElement("tr");

            row.innerHTML = `<td>${name}</td> <td>${email}</td> <td>${age}</td>`;

            document.getElementById("tablebody").appendChild(row);

            form.reset();
        })
    </script>
</body>

</html>
