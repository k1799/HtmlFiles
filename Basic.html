<!DOCTYPE html>

<html>

<head>
    <title>Student Website</title>
</head>

<body>

    <h1>Student Registration</h1>

    <p>
        Welcome to our student registration page.
        <strong>Please fill the form.</strong>
    </p>

    <hr>

    <h2>Student Details</h2>

    <form>

        <label>Name:</label>
        <input type="text">

        <br><br>

        <label>Email:</label>
        <input type="email">

        <br><br>

        <label>Age:</label>
        <input type="number">

        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female

        <br><br>

        <label>Course:</label>

        <select>
            <option>Java</option>
            <option>Python</option>
            <option>Web Development</option>
        </select>

        <br><br>

        <button type="submit">Register</button>

    </form>

    <hr>

    <h2>Student Table</h2>

    <table border="1">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Course</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Ravi</td>
            <td>Java</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Kannan</td>
            <td>HTML</td>
        </tr>

    </table>

    <h2>Student Photo</h2>

    <img src="student.jpg" width="200">

    <h2>Video</h2>

    <video width="400" controls>
        <source src="video.mp4" type="video/mp4">
    </video>

</body>

</html>
