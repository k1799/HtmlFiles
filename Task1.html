<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        .card{
            width: 300px; 
            padding: 20px; 
            margin: 100px auto;
            text-align: center;
            border: 2px solid black;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        h2{
            margin: 10px;
        }
        .role{
            color: blue;
        }
        button{
            background-color: blue;
            color: white;
            padding: 10px 40px;
            border: none;
            border-radius: 5px;
        }
        img{
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }

    </style>
</head>

<body>
    <div class="card">
        <img src="./spider.jpg" alt="resume">
        <h2>Tom Holland</h2>
        <p class="role">Web Developer</p> 
        <p>passionate about building beautiful <br> web experiences.</p>
        <button>Follow</button>
    </div>
</body>

</html>
