<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loader</title>
    <style>
        div
        {
            height: 50px;
            width: 50px;
            border: 8px solid rgb(122, 42, 42);
            border-radius: 50%;
            border-top: 8px solid blue;
            animation: spineer 1s linear 1;
            
        }
        @keyframes spineer
        {
            from
            {
                transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div>

    </div>
</body>
</html>
