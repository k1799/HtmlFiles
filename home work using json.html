<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API Form</title>
    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
        }

        table {
            margin-top: 20px;
            border-collapse: collapse;
            width: 600px;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>

<body>
    <!-- QUESTION 2:
    I.Create a form.The form should contain three buttons:
    Save
    Update
    View.
    II.When:
    Save button is clicked → Send form data to a server using Fetch API (POST method) in JSON format.
    Update button is clicked → Update existing data using Fetch API (PUT method).
    View button is clicked → Fetch and display all records using Fetch API (GET method) in table format.
    III. Use:
    fetch()
    JSON object -->
    <h2>Student Form</h2>
    <form action="" id="studentForm">
        <input type="number" id="id" placeholder="Enter ID">
        <input type="text" id="name" placeholder="Enter Name">
        <input type="email" id="email" placeholder="Enter Email"> <br><br>

        <button type="button" id="saveBtn">Save</button>
        <button type="button" id="updateBtn">Update</button>
        <button type="button" id="viewBtn">View</button>
    </form>
    <h2>Student Records</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        let url = "https://jsonplaceholder.typicode.com/users";

        let id = document.getElementById("id");
        let name = document.getElementById("name");
        let email = document.getElementById("email");

        let saveBtn = document.getElementById("saveBtn");
        let updateBtn = document.getElementById("updateBtn");
        let viewBtn = document.getElementById("viewBtn");

        let tableBody = document.getElementById("tableBody");

        // SAVE - POST
        saveBtn.addEventListener("click", function () {
            // Create JSON object 
            let student = { name: name.value, email: email.value };
            fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(student)
            })
                .then(response => response.json())
                .then(data => {
                    console.log("Saved:", data);
                    alert("Student saved successfully!");
                })
                .catch(error => { console.log("Error:", error); });
        });

        // UPDATE - PUT
        updateBtn.addEventListener("click", function () {
            let studentId = id.value;
            let student = { name: name.value, email: email.value };
            fetch(url + "/" + studentId, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"

                },
                body: JSON.stringify(student)
            })
                .then(response => response.json())
                .then(data => {
                    console.log("Updated:", data);
                    alert("Student updated successfully!");
                })
                .catch(error => {
                    console.log("Error:", error);

                });
        });

        // VIEW - GET
        viewBtn.addEventListener("click", function () {
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    tableBody.innerHTML = "";
                    data.forEach(student => {
                        let row = document.createElement("tr");
                        row.innerHTML =
                            ` <td>${student.id}</td>
                     <td>${student.name}</td> 
                     <td>${student.email}</td> `;
                        tableBody.appendChild(row);
                    });
                })
                .catch(error => {
                    console.log("Error:", error);

                });
        });
    </script>
</body>

</html>
