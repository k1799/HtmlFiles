<!-- Fetch API + Table Practice -->
 <!DOCTYPE html>
<html>

<head>
    <title>Users</title>
</head>

<body>

    <h2>User Details</h2>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        async function getUsers() {
            try {

                let response = await fetch("https://jsonplaceholder.typicode.com/users");
                let users = await response.json();
                let table = document.getElementById("tableBody");
                users.forEach(user => {
                    table.innerHTML += `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.name}</td>
                            <td>${user.email}</td>
                        </tr> `;
                });
            }
            catch (error) {
                console.log(error);
            }
        }
        getUsers();
    </script>
</body>
</html>
