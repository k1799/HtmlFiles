<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Local Storage Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }

        .container {
            width: 500px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        .save {
            background: green;
            color: white;
        }

        .show {
            background: blue;
            color: white;
        }

        .clear {
            background: red;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        #message {
            display: none;
            margin-top: 20px;
            padding: 12px;
            text-align: center;
            background: #d4edda;
            color: #155724;
            border-radius: 5px;
        }

        #output {
            margin-top: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #eee;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Student Details</h2>

        <form id="studentForm">

            <label>Name</label>
            <input type="text" id="name" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label>Phone</label>
            <input type="text" id="phone" placeholder="Enter your phone">

            <div class="buttons">

                <button type="button" class="save" onclick="saveData()">
                    Save
                </button>

                <button type="button" class="show" onclick="showData()">
                    Show
                </button>

                <button type="button" class="clear" onclick="clearData()">
                    Clear
                </button>

            </div>

        </form>

        <div id="message">
            Saved Successfully!
        </div>

        <div id="output"></div>

    </div>


    <script>

        function saveData() {

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let phone = document.getElementById("phone").value;

            if (name === "" || email === "" || phone === "") {
                alert("Please fill all fields");
                return;
            }

            let student = {
                name: name,
                email: email,
                phone: phone
            };

            localStorage.setItem("student", JSON.stringify(student));

            document.getElementById("message").style.display = "block";

            setTimeout(function () {
                document.getElementById("message").style.display = "none";
            }, 2000);
        }


        function showData() {

            let data = localStorage.getItem("student");

            if (data === null) {
                alert("No data found");
                return;
            }

            let student = JSON.parse(data);

            document.getElementById("output").innerHTML = `

                <h3>Saved Student Details</h3>

                <table>

                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                    </tr>

                    <tr>
                        <td>${student.name}</td>
                        <td>${student.email}</td>
                        <td>${student.phone}</td>
                    </tr>

                </table>
            `;
        }


        function clearData() {

            localStorage.removeItem("student");

            document.getElementById("output").innerHTML = "";

            document.getElementById("studentForm").reset();

            alert("Data Cleared Successfully");
        }

    </script>

</body>

</html>
